<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bezier Curve Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="controls">
        <form id="bezier-form">
            <div class="input-group">
                <label for="latitudeA">latA:</label>
                <input type="number" id="latitudeA" step="0.01" value="0" min="-90" max="90">
            </div>
            <div class="input-group">
                <label for="longitudeA">lonA:</label>
                <input type="number" id="longitudeA" step="0.01" value="0" min="-180" max="180">
            </div>
            <div class="input-group">
                <label for="latitudeB">latB:</label>
                <input type="number" id="latitudeB" step="0.01" value="45" min="-90" max="90">
            </div>
            <div class="input-group">
                <label for="longitudeB">lonB:</label>
                <input type="number" id="longitudeB" step="0.01" value="45" min="-180" max="180">
            </div>
            <button type="button" id="add-bezier">get coordinates</button>
            <button type="button" id="start">draw bezier curve</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
